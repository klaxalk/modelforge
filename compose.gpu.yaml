# CUDA variant (needs a working NVIDIA driver + nvidia-container-toolkit on the host):
#   env UID=$(id -u) GID=$(id -g) docker compose -f compose.yaml -f compose.gpu.yaml build dev
#   MODELFORGE_GPU=1 scripts/dev ...      (dev container: CUDA COLMAP + nerfstudio splatfacto)
#   scripts/splat data/clip_frames        (splat from the shell; the GUI Run tab does the same)
services:
  dev:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.8.1-devel-ubuntu24.04
        CUDA_ENABLED: "ON"
        CUDA_ARCHITECTURES: "75;80;86;89;90;120"  # Turing .. Blackwell (RTX 50xx needs 120)
        NERFSTUDIO: "ON"  # /opt/nerfstudio venv: torch cu128 + gsplat + nerfstudio (resources/nerfstudio)
    image: modelforge-dev:cuda
    gpus: all
    ports:
      - "7007:7007"  # nerfstudio viewer while training
    shm_size: 8gb  # torch data loaders
